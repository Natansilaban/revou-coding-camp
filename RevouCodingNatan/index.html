<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense & Budget Visualizer</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Header Section -->
    <header>
        <h1>Expense & Budget Visualizer</h1>
        <button 
            id="theme-toggle" 
            class="theme-toggle-btn" 
            aria-label="Toggle between light and dark mode"
            title="Toggle theme"
        >
            <span class="theme-icon" aria-hidden="true">☀️</span>
            <span class="theme-text">Light</span>
        </button>
    </header>

    <!-- Balance Display Section -->
    <section class="balance-section">
        <h2>Total Balance</h2>
        <div id="balance-display" class="balance-amount">$0.00</div>
    </section>

    <!-- Input Form Section -->
    <section class="input-section">
        <h2>Add Transaction</h2>
        <form id="transaction-form">
            <div class="form-group">
                <label for="item-name">Item Name</label>
                <input 
                    type="text" 
                    id="item-name" 
                    name="itemName" 
                    placeholder="e.g., Coffee" 
                    required
                    maxlength="100"
                >
            </div>
            
            <div class="form-group">
                <label for="amount">Amount</label>
                <input 
                    type="number" 
                    id="amount" 
                    name="amount" 
                    placeholder="0.00" 
                    step="0.01" 
                    min="0.01"
                    required
                >
            </div>
            
            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" name="category" required>
                    <option value="">Select a category</option>
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Fun">Fun</option>
                </select>
            </div>
            
            <div class="error-message" id="error-message" role="alert" aria-live="polite"></div>
            
            <button type="submit" class="btn-primary">Add Transaction</button>
        </form>
        
        <!-- Custom Category Section -->
        <div class="custom-category-section">
            <h3>Custom Categories</h3>
            <button type="button" id="add-category-btn" class="btn-secondary">+ Add Custom Category</button>
            
            <!-- Custom Category Form (Initially Hidden) -->
            <div id="custom-category-form" class="custom-category-form hidden">
                <div class="form-group">
                    <label for="custom-category-name">Category Name</label>
                    <input 
                        type="text" 
                        id="custom-category-name" 
                        placeholder="e.g., Entertainment" 
                        maxlength="50"
                    >
                </div>
                
                <div class="form-group">
                    <label for="custom-category-color">Category Color</label>
                    <input 
                        type="color" 
                        id="custom-category-color" 
                        value="#9966FF"
                    >
                </div>
                
                <div class="custom-category-actions">
                    <button type="button" id="save-category-btn" class="btn-primary">Save Category</button>
                    <button type="button" id="cancel-category-btn" class="btn-secondary">Cancel</button>
                </div>
                
                <div class="error-message" id="category-error-message" role="alert" aria-live="polite"></div>
            </div>
            
            <!-- List of Custom Categories -->
            <div id="custom-category-list" class="custom-category-list"></div>
        </div>
    </section>

    <!-- Chart Component Section -->
    <section class="chart-section">
        <h2>Spending by Category</h2>
        <div class="chart-container">
            <canvas id="spending-chart" aria-label="Pie chart showing spending distribution by category"></canvas>
            <div id="chart-empty-state" class="empty-state hidden">
                <p>No spending data yet. Add your first transaction to see the chart!</p>
            </div>
        </div>
    </section>

    <!-- Transaction List Section -->
    <section class="transaction-section">
        <h2>Transaction History</h2>
        <div id="transaction-list" class="transaction-list">
            <div id="list-empty-state" class="empty-state">
                <p>No transactions yet. Start tracking your expenses!</p>
            </div>
        </div>
    </section>

    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    
    <!-- Application JavaScript -->
    <script src="js/app.js"></script>
</body>
</html>
