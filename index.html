<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense & Budget Visualizer</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
    
    <!-- App Logic -->
    <script src="js/main.js" defer></script>
</head>
<body data-theme="light">
    <div class="app-container">
        
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1>Expense & Budget Visualizer</h1>
                <button id="theme-toggle" class="icon-btn" aria-label="Toggle Dark Mode" title="Toggle Theme">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </header>

        <!-- Main Workspace -->
        <main class="main-content">
            
            <!-- Context Section (Total & Input) -->
            <section class="context-section">
                <!-- Total Balance Card -->
                <div class="card premium-card balance-card">
                    <div class="card-glow"></div>
                    <p class="subtitle">TOTAL BALANCE</p>
                    <h2 id="total-balance" class="balance-text">$0.00</h2>
                </div>

                <!-- Add Transaction Form -->
                <div class="card form-card">
                    <h3>Add Transaction</h3>
                    <form id="transaction-form" novalidate>
                        <div class="form-row">
                            <div class="form-group flex-2">
                                <label for="item-name">Item Name</label>
                                <input type="text" id="item-name" placeholder="e.g. Groceries" required>
                            </div>
                            <div class="form-group flex-1">
                                <label for="item-amount">Amount ($)</label>
                                <input type="number" id="item-amount" placeholder="0.00" step="0.01" min="0.01" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="item-category">Category</label>
                            <div class="category-input-wrapper">
                                <select id="item-category" required>
                                    <option value="" disabled selected>Select category</option>
                                    <!-- Options injected via JS -->
                                </select>
                                <button type="button" id="btn-add-category" class="secondary-btn icon-text-btn" title="Create Custom Category">
                                    <i class="fas fa-plus"></i>
                                </button>
                            </div>
                        </div>

                        <button type="submit" class="primary-btn w-full">
                            <i class="fas fa-check-circle"></i> Add Transaction
                        </button>
                    </form>
                </div>
            </section>

            <!-- Data Display Section -->
            <section class="display-section">
                <!-- Transactions List -->
                <div class="card list-card">
                    <div class="card-header">
                        <h3>Transactions</h3>
                        <div class="sort-control">
                            <label for="sort-select" class="sr-only">Sort by:</label>
                            <select id="sort-select">
                                <option value="date-desc">Newest First</option>
                                <option value="date-asc">Oldest First</option>
                                <option value="amount-desc">Highest Amount</option>
                                <option value="amount-asc">Lowest Amount</option>
                                <option value="category">Category</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="list-wrapper">
                        <ul id="transaction-list" class="transaction-list">
                            <!-- Items injected via JS -->
                        </ul>
                        <div id="empty-list-state" class="empty-state">
                            <div class="icon-blob">
                                <i class="fas fa-receipt"></i>
                            </div>
                            <p>No transactions yet.</p>
                            <span class="hint">Your added expenses will appear here.</span>
                        </div>
                    </div>
                </div>

                <!-- Visual Chart -->
                <div class="card chart-card">
                    <h3>Spending by Category</h3>
                    <div class="chart-wrapper">
                        <canvas id="category-chart"></canvas>
                        <div id="empty-chart-state" class="empty-state">
                            <div class="icon-blob">
                                <i class="fas fa-chart-pie"></i>
                            </div>
                            <p>No data to visualize.</p>
                            <span class="hint">Add transactions to see the chart.</span>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Custom Category Modal Overlay -->
    <div id="category-modal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3>New Category</h3>
                <button id="close-modal-btn" class="icon-btn close-btn" aria-label="Close Modal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form id="category-form" class="modal-body">
                <div class="form-group">
                    <label for="new-category-name">Category Name</label>
                    <input type="text" id="new-category-name" placeholder="e.g. Subscriptions" required>
                </div>
                <div class="form-group">
                    <label for="new-category-color">Color Identifier</label>
                    <div class="color-picker-container">
                        <input type="color" id="new-category-color" value="#8b5cf6">
                        <span id="color-hex-display" class="hex-display">#8b5cf6</span>
                    </div>
                </div>
                <button type="submit" class="primary-btn w-full">Save Category</button>
            </form>
        </div>
    </div>
</body>
</html>
